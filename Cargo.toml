[package]
name = "oxyconvert"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Universal converter for ZBrush, Blender, and Nomad Sculpt plugins to the .oxyaddon system"
repository = "https://github.com/crisprintsstuff/OxyConvert"
rust-version = "1.88"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
egui = { version = "0.37", features = ["default_fonts"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
rfd = "0.17"
dirs = "7"
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
log = "0.4"
env_logger = "0.11"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[lints.rust]
unsafe_code = "forbid"
